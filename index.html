<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nihongo Kanji Jlpt N5-N4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .jp-text { font-family: 'Noto Sans JP', sans-serif; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #writingCanvas { touch-action: none; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        .flashcard-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { backface-visibility: hidden; }
        .flashcard-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- Header & Progress -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 rounded-b-3xl shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center mb-2">
            <div>
                <h1 class="text-xl font-bold">Nihongo Jlpt N5-N4</h1>
                <p class="text-sm text-blue-200">Latihan Kanji Menghafal & Menulis</p>
            </div>
            <div class="bg-white/20 px-3 py-1 rounded-full text-sm font-semibold backdrop-blur-sm">
                Progres: <span id="progressCount">0</span>/<span id="totalVocabCount">0</span>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex justify-around bg-white mx-4 mt-4 rounded-xl shadow-sm p-2 text-sm font-medium text-slate-500 mb-6">
        <button onclick="switchTab('tab-flashcard')" id="btn-tab-flashcard" class="tab-btn active px-4 py-2 text-blue-600 border-b-2 border-blue-600">🎴 Flashcard</button>
        <button onclick="switchTab('tab-kuis')" id="btn-tab-kuis" class="tab-btn px-4 py-2 hover:text-blue-600">🎮 Kuis</button>
        <button onclick="switchTab('tab-menulis')" id="btn-tab-menulis" class="tab-btn px-4 py-2 hover:text-blue-600">✍️ Menulis</button>
        <button onclick="switchTab('tab-daftar')" id="btn-tab-daftar" class="tab-btn px-4 py-2 hover:text-blue-600">📖 Daftar</button>
    </nav>

    <main class="px-4">
        
        <!-- TAB: FLASHCARD -->
        <section id="tab-flashcard" class="tab-content active">
            <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 flex justify-between gap-2">
                <select id="flashcardCategory" class="w-full bg-slate-100 p-2 rounded-lg outline-none text-sm" onchange="initFlashcard()">
                    <!-- Diisi otomatis oleh JavaScript -->
                </select>
                <select id="flashcardFilter" class="w-full bg-slate-100 p-2 rounded-lg outline-none text-sm" onchange="initFlashcard()">
                    <option value="ALL">Semua Status</option>
                    <option value="belum">Belum Hafal</option>
                    <option value="hafal">Sudah Hafal</option>
                </select>
            </div>

            <div class="flashcard w-full h-80 perspective-1000 cursor-pointer" onclick="toggleFlashcard()">
                <div class="flashcard-inner relative w-full h-full text-center">
                    <!-- Front -->
                    <div class="flashcard-front absolute w-full h-full bg-white rounded-3xl shadow-md border-2 border-slate-100 flex flex-col justify-center items-center p-6">
                        <p class="text-sm text-slate-400 mb-4" id="fcCounter">1 / 150</p>
                        <h2 class="text-7xl font-bold jp-text text-slate-800" id="fcKanji">私</h2>
                        <button onclick="event.stopPropagation(); playAudioFc()" class="mt-8 bg-blue-100 text-blue-600 w-12 h-12 rounded-full flex items-center justify-center text-xl hover:bg-blue-200 transition">🔊</button>
                    </div>
                    <!-- Back -->
                    <div class="flashcard-back absolute w-full h-full bg-blue-50 rounded-3xl shadow-md border-2 border-blue-200 flex flex-col justify-center items-center p-6">
                        <p class="text-2xl font-bold text-blue-800 mb-2" id="fcRomaji">watashi</p>
                        <p class="text-lg text-slate-600 font-medium text-center" id="fcArti">Saya</p>
                        
                        <div class="mt-8 flex gap-4">
                            <button onclick="event.stopPropagation(); markMemorized(false)" class="px-6 py-2 bg-red-100 text-red-600 rounded-full font-semibold hover:bg-red-200">❌ Belum</button>
                            <button onclick="event.stopPropagation(); markMemorized(true)" class="px-6 py-2 bg-green-100 text-green-600 rounded-full font-semibold hover:bg-green-200">✅ Hafal</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-between mt-6 gap-4">
                <button onclick="prevCard()" class="flex-1 bg-white shadow-sm py-3 rounded-xl font-semibold text-slate-600 hover:bg-slate-50">⬅️ Seb</button>
                <button onclick="nextCard()" class="flex-1 bg-blue-600 shadow-md py-3 rounded-xl font-semibold text-white hover:bg-blue-700">Sel ➡️</button>
            </div>
        </section>

        <!-- TAB: KUIS -->
        <section id="tab-kuis" class="tab-content">
            <div id="quizSetup" class="bg-white p-6 rounded-2xl shadow-sm text-center">
                <h2 class="text-xl font-bold mb-4">Pengaturan Kuis</h2>
                
                <label class="block text-left text-sm font-medium text-slate-600 mb-2">Kategori Kosakata:</label>
                <select id="quizCategory" class="w-full bg-slate-100 p-3 rounded-xl outline-none mb-4">
                    <!-- Diisi otomatis oleh JavaScript -->
                </select>

                <label class="block text-left text-sm font-medium text-slate-600 mb-2">Jumlah Soal:</label>
                <select id="quizLength" class="w-full bg-slate-100 p-3 rounded-xl outline-none mb-6">
                    <option value="10">10 Soal</option>
                    <option value="20">20 Soal</option>
                    <option value="50">50 Soal</option>
                    <option value="100">100 Soal</option>
                    <option value="ALL">Semua Soal</option>
                </select>

                <button onclick="startQuiz()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-blue-700 transition">🚀 Mulai Kuis</button>
            </div>

            <div id="quizPlay" class="hidden">
                <div class="bg-white p-6 rounded-2xl shadow-sm text-center mb-6">
                    <p class="text-sm font-bold text-slate-400 mb-2" id="quizProgressText">Soal 1 / 10</p>
                    <h2 class="text-6xl font-bold jp-text text-slate-800 my-4" id="quizKanji">-</h2>
                    <p id="quizFeedback" class="text-lg font-bold min-h-[28px] mt-2"></p>
                </div>
                <div class="grid grid-cols-1 gap-3" id="quizOptions"></div>
            </div>
            
            <div id="quizResult" class="hidden bg-white p-6 rounded-2xl shadow-sm text-center">
                <h2 class="text-2xl font-bold mb-2 text-slate-800">Kuis Selesai! 🎉</h2>
                <p class="text-5xl font-extrabold text-blue-600 my-6" id="quizScore">100%</p>
                <p class="text-slate-600 mb-6" id="quizDetailScore">Benar: 10 | Salah: 0</p>
                <button onclick="document.getElementById('quizPlay').classList.add('hidden'); document.getElementById('quizResult').classList.add('hidden'); document.getElementById('quizSetup').classList.remove('hidden');" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">Ulangi Kuis</button>
            </div>
        </section>

        <!-- TAB: MENULIS -->
        <section id="tab-menulis" class="tab-content">
            <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 flex justify-between gap-2">
                <select id="writeCategory" class="w-full bg-slate-100 p-2 rounded-lg outline-none text-sm" onchange="initWrite()">
                    <!-- Diisi otomatis oleh JavaScript -->
                </select>
                <button onclick="initWrite()" class="bg-slate-100 px-4 py-2 rounded-lg text-sm font-semibold">Acak 🎲</button>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm text-center relative">
                <button onclick="playWriteAudio()" class="absolute top-4 right-4 z-10 bg-blue-100 text-blue-600 w-10 h-10 rounded-full flex items-center justify-center text-lg hover:bg-blue-200 transition">🔊</button>
                
                <h2 class="text-5xl font-bold jp-text text-slate-800 mb-2" id="writeKanji">私</h2>
                <p class="text-lg font-bold text-blue-600" id="writeRomaji">watashi</p>
                <p class="text-sm text-slate-500" id="writeArti">Saya</p>
                
                <div class="border-2 border-dashed border-slate-300 rounded-xl overflow-hidden mt-6 bg-white relative">
                    <canvas id="writingCanvas" class="w-full aspect-square touch-none"></canvas>
                </div>

                <div class="flex gap-4 mt-6">
                    <button onclick="clearCanvas()" class="flex-1 bg-red-50 text-red-600 font-bold py-3 rounded-xl border border-red-100">🗑️ Hapus</button>
                    <button onclick="nextWrite()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">Selanjutnya ➡️</button>
                </div>
            </div>
        </section>

        <!-- TAB: DAFTAR KOSAKATA -->
        <section id="tab-daftar" class="tab-content">
            <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 flex gap-2">
                <select id="listCategoryFilter" class="w-full bg-slate-100 p-2 rounded-lg outline-none text-sm" onchange="renderList()">
                    <!-- Diisi otomatis oleh JavaScript -->
                </select>
                <select id="listStatusFilter" class="w-full bg-slate-100 p-2 rounded-lg outline-none text-sm" onchange="renderList()">
                    <option value="ALL">Semua Status</option>
                    <option value="belum">Belum Hafal</option>
                    <option value="hafal">Sudah Hafal</option>
                </select>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <ul id="vocabList" class="divide-y divide-slate-100 max-h-[60vh] overflow-y-auto">
                    <!-- List dirender via JS -->
                </ul>
            </div>
        </section>

    </main>

// --- LOCAL STORAGE MANAGER ---
let memorizedKanji = JSON.parse(localStorage.getItem('nihongoProgres')) || [];

function saveProgress() {
    localStorage.setItem('nihongoProgres', JSON.stringify(memorizedKanji));
    updateProgressUI();
}

function updateProgressUI() {
    document.getElementById('progressCount').innerText = memorizedKanji.length;
    document.getElementById('totalVocabCount').innerText = masterData.length;
}

// --- GENERATE KATEGORI OPTIONS DENGAN JUMLAH ---
function populateCategoryDropdowns() {
    // Ambil daftar kategori unik
    let categories = [...new Set(masterData.map(item => item.category))];
    
    // Siapkan HTML opsi "Semua Kategori" dengan total keseluruhan
    let optionsHtml = `<option value="ALL">Semua Kategori (${masterData.length} Kosakata)</option>`;
    
    // Hitung dan masukkan masing-masing kategori beserta jumlahnya
    categories.forEach(cat => {
        let count = masterData.filter(item => item.category === cat).length;
        optionsHtml += `<option value="${cat}">${cat} (${count} Kosakata)</option>`;
    });

    // Terapkan ke semua elemen select kategori
    ['flashcardCategory', 'quizCategory', 'writeCategory', 'listCategoryFilter'].forEach(id => {
        let el = document.getElementById(id);
        if (el) {
            el.innerHTML = optionsHtml;
        }
    });
}

// Inisialisasi awal saat halaman dimuat
populateCategoryDropdowns();
updateProgressUI();

// --- TEXT TO SPEECH ---
function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.8; 
        window.speechSynthesis.speak(utterance);
    }
}

// --- UTILITIES ---
function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
    });
    document.getElementById(tabId).classList.add('active');
    document.getElementById('btn-' + tabId).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');

    if(tabId === 'tab-flashcard') initFlashcard();
    if(tabId === 'tab-menulis') setTimeout(initWrite, 100); 
    if(tabId === 'tab-daftar') renderList();
}

// --- FLASHCARD LOGIC ---
let fcData = [];
let fcIndex = 0;

function initFlashcard() {
    let cat = document.getElementById('flashcardCategory').value;
    let stat = document.getElementById('flashcardFilter').value;
    
    fcData = masterData.filter(item => {
        let matchCat = (cat === 'ALL' || item.category === cat);
        let isMem = memorizedKanji.includes(item.kanji);
        let matchStat = (stat === 'ALL') || (stat === 'hafal' && isMem) || (stat === 'belum' && !isMem);
        return matchCat && matchStat;
    });

    if(fcData.length === 0) {
        document.getElementById('fcKanji').innerText = "Kosong";
        document.getElementById('fcRomaji').innerText = "-";
        document.getElementById('fcArti').innerText = "Ganti filter";
        return;
    }
    fcData = shuffle(fcData);
    fcIndex = 0;
    renderFlashcard();
}

function renderFlashcard() {
    if(fcData.length === 0) return;
    document.querySelector('.flashcard').classList.remove('flipped');
    let item = fcData[fcIndex];
    document.getElementById('fcCounter').innerText = `${fcIndex + 1} / ${fcData.length}`;
    document.getElementById('fcKanji').innerText = item.kanji;
    document.getElementById('fcRomaji').innerText = item.romaji;
    document.getElementById('fcArti').innerText = item.meaning;
}

function toggleFlashcard() { document.querySelector('.flashcard').classList.toggle('flipped'); }
function nextCard() { if(fcData.length > 0) { fcIndex = (fcIndex + 1) % fcData.length; renderFlashcard(); } }
function prevCard() { if(fcData.length > 0) { fcIndex = (fcIndex - 1 + fcData.length) % fcData.length; renderFlashcard(); } }
function playAudioFc() { speakText(fcData[fcIndex].kanji); }

function markMemorized(isHafal) {
    let currentKanji = fcData[fcIndex].kanji;
    if(isHafal && !memorizedKanji.includes(currentKanji)) {
        memorizedKanji.push(currentKanji);
    } else if(!isHafal && memorizedKanji.includes(currentKanji)) {
        memorizedKanji = memorizedKanji.filter(k => k !== currentKanji);
    }
    saveProgress();
    setTimeout(nextCard, 300);
}

// --- QUIZ LOGIC ---
let quizData = [];
let quizIndex = 0;
let quizScore = 0;
let isAnswered = false;

function startQuiz() {
    let cat = document.getElementById('quizCategory').value;
    let len = document.getElementById('quizLength').value;

    let filtered = masterData.filter(item => cat === 'ALL' || item.category === cat);
    filtered = shuffle(filtered);
    
    if (len !== 'ALL') {
        quizData = filtered.slice(0, parseInt(len));
    } else {
        quizData = filtered;
    }

    if(quizData.length < 4) {
        alert('Kosakata pada kategori ini kurang untuk dijadikan kuis (minimal 4 soal). Ganti kategori atau jumlah soal.');
        return;
    }

    quizIndex = 0;
    quizScore = 0;
    document.getElementById('quizSetup').classList.add('hidden');
    document.getElementById('quizResult').classList.add('hidden');
    document.getElementById('quizPlay').classList.remove('hidden');
    loadQuizQuestion();
}

function loadQuizQuestion() {
    isAnswered = false;
    document.getElementById('quizFeedback').innerText = "";
    document.getElementById('quizProgressText').innerText = `Soal ${quizIndex + 1} / ${quizData.length}`;
    
    let currentQ = quizData[quizIndex];
    document.getElementById('quizKanji').innerText = currentQ.kanji;
    
    let options = [currentQ];
    let pool = masterData.filter(x => x.kanji !== currentQ.kanji);
    pool = shuffle(pool).slice(0, 3);
    options = shuffle([...options, ...pool]);

    let optsContainer = document.getElementById('quizOptions');
    optsContainer.innerHTML = "";
    
    options.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = "w-full bg-slate-50 border-2 border-slate-200 text-slate-700 font-semibold py-4 rounded-xl text-left px-6 hover:bg-slate-100 transition";
        btn.innerText = opt.meaning;
        btn.onclick = () => checkAnswer(opt, currentQ, btn);
        optsContainer.appendChild(btn);
    });
}

function checkAnswer(selected, correct, btnNode) {
    if(isAnswered) return;
    isAnswered = true;
    speakText(correct.kanji); 

    let feedback = document.getElementById('quizFeedback');
    
    if(selected.kanji === correct.kanji) {
        btnNode.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-700');
        btnNode.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
        feedback.innerText = `✅ Benar! (${correct.romaji})`;
        feedback.className = "text-lg font-bold min-h-[28px] mt-2 text-green-600";
        quizScore++;
    } else {
        btnNode.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-700');
        btnNode.classList.add('bg-red-100', 'border-red-500', 'text-red-700');
        feedback.innerText = `❌ Salah! Jawaban: ${correct.meaning} (${correct.romaji})`;
        feedback.className = "text-lg font-bold min-h-[28px] mt-2 text-red-600";
    }

    setTimeout(() => {
        quizIndex++;
        if(quizIndex < quizData.length) {
            loadQuizQuestion();
        } else {
            showQuizResult();
        }
    }, 1500);
}

// --- MENULIS CANVAS LOGIC ---
const canvas = document.getElementById('writingCanvas');
const ctx = canvas.getContext('2d');
let drawing = false;
let writeData = [];
let writeIndex = 0;

function initWrite() {
    let cat = document.getElementById('writeCategory').value;
    writeData = masterData.filter(item => cat === 'ALL' || item.category === cat);
    writeData = shuffle(writeData);
    writeIndex = 0;
    loadWriteData();
    initCanvas();
}

function loadWriteData() {
    if(writeData.length === 0) return;
    let item = writeData[writeIndex];
    document.getElementById('writeKanji').innerText = item.kanji;
    document.getElementById('writeRomaji').innerText = item.romaji;
    document.getElementById('writeArti').innerText = item.meaning;
    clearCanvas();
}

function playWriteAudio() {
    if(writeData.length > 0) speakText(writeData[writeIndex].kanji);
}

function nextWrite() {
    if(writeData.length > 0) {
        writeIndex = (writeIndex + 1) % writeData.length;
        loadWriteData();
    }
}

function initCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#1e293b";
}

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function getPos(e) {
    let rect = canvas.getBoundingClientRect();
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
}

canvas.addEventListener('mousedown', (e) => { drawing = true; let pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
canvas.addEventListener('mousemove', (e) => { if (drawing) { let pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); } });
canvas.addEventListener('mouseup', () => { drawing = false; });
canvas.addEventListener('mouseleave', () => { drawing = false; });

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; let pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (drawing) { let pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); } }, { passive: false });
canvas.addEventListener('touchend', () => { drawing = false; });

// --- DAFTAR KOSAKATA LOGIC ---
function renderList() {
    let cat = document.getElementById('listCategoryFilter').value;
    let stat = document.getElementById('listStatusFilter').value;
    
    const listEl = document.getElementById('vocabList');
    listEl.innerHTML = "";

    let filtered = masterData.filter(item => {
        let matchCat = (cat === 'ALL' || item.category === cat);
        let isMem = memorizedKanji.includes(item.kanji);
        let matchStat = (stat === 'ALL') || (stat === 'hafal' && isMem) || (stat === 'belum' && !isMem);
        return matchCat && matchStat;
    });

    filtered.forEach(item => {
        let isMem = memorizedKanji.includes(item.kanji);
        let li = document.createElement('li');
        li.className = "flex justify-between items-center p-4 hover:bg-slate-50";
        li.innerHTML = `
            <div class="flex items-center gap-4">
                <button onclick="speakText('${item.kanji}')" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded-full w-10 h-10 flex items-center justify-center">🔊</button>
                <div>
                    <h3 class="text-xl font-bold jp-text">${item.kanji} <span class="text-sm text-slate-400 ml-2 font-normal font-sans">${item.romaji}</span></h3>
                    <p class="text-sm text-slate-600">${item.meaning} <span class="text-xs bg-slate-200 px-2 py-0.5 rounded text-slate-500 ml-1">${item.category}</span></p>
                </div>
            </div>
            <div>
                ${isMem ? '<span class="text-xs font-bold text-green-600 bg-green-100 px-2 py-1 rounded">✅ Hafal</span>' : '<span class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">Belum</span>'}
            </div>
        `;
        listEl.appendChild(li);
    });
}

initFlashcard();
